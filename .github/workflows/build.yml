name: Build, Verify, and Release NetBox Images

on:
  push:
    branches: [main]
    paths: [versions.json]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish, sign, and release the verified images and update the README
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      latest: ${{ steps.matrix.outputs.latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            git show HEAD^:versions.json > /tmp/previous-versions.json 2>/dev/null || echo '{"versions":[]}' > /tmp/previous-versions.json
            matrix=$(jq -cn \
              --argjson current "$(cat versions.json)" \
              --argjson previous "$(cat /tmp/previous-versions.json)" \
              '{include: [$current.versions[] as $version | select(any($previous.versions[]; .version == $version.version and .revision != $version.revision) or all($previous.versions[]; .version != $version.version)) | {netbox_version: $version.version, revision: $version.revision, image_tag: ($version.version + "-r" + ($version.revision | tostring))}]}' \
            )
          else
            matrix=$(jq -c '{include: [.versions[] | {netbox_version: .version, revision: .revision, image_tag: (.version + "-r" + (.revision | tostring))}]}' versions.json)
          fi
          echo "versions=${matrix}" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.versions[-1].version' versions.json)" >> "$GITHUB_OUTPUT"

  verify-and-release:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_ENABLED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.RELEASE_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan previous revision
        env:
          REVISION: ${{ matrix.revision }}
          NETBOX_VERSION: ${{ matrix.netbox_version }}
        run: |
          if [ "$REVISION" -gt 0 ]; then
            repository=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
            previous="${REGISTRY}/${repository}:${NETBOX_VERSION}-r$((REVISION - 1))"
            grype "$previous" -o json --file before-grype.json || test -s before-grype.json || echo '{"matches":[]}' > before-grype.json
            trivy image --format json --output before-trivy.json --no-progress "$previous" || test -s before-trivy.json || echo '{"Results":[]}' > before-trivy.json
          else
            echo '{"matches":[]}' > before-grype.json
            echo '{"Results":[]}' > before-trivy.json
          fi
      - name: Build candidate locally
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: candidate:${{ matrix.image_tag }}
          build-args: NETBOX_VERSION=${{ matrix.netbox_version }}
          cache-from: type=gha,scope=netbox-${{ matrix.netbox_version }}
          cache-to: type=gha,mode=max,scope=netbox-${{ matrix.netbox_version }}
      - name: Scan candidate and generate release report
        env:
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          grype "candidate:${IMAGE_TAG}" -o json --file after-grype.json
          trivy image --format json --output after-trivy.json --no-progress "candidate:${IMAGE_TAG}"
          report_status=0
          python scripts/security_report.py report \
            --before before-grype.json before-trivy.json \
            --after after-grype.json after-trivy.json \
            --image "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            --output security-report.md || report_status=$?
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"
      - name: Create SARIF
        if: always()
        run: grype "candidate:${{ matrix.image_tag }}" -o sarif --file grype.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('grype.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: grype.sarif
          category: grype-${{ matrix.image_tag }}
      - name: Docker metadata
        if: env.RELEASE_ENABLED == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.image_tag }}
            type=raw,value=${{ matrix.netbox_version }}
            type=raw,value=latest,enable=${{ matrix.netbox_version == needs.matrix.outputs.latest }}
      - name: Publish verified image
        if: env.RELEASE_ENABLED == 'true'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NETBOX_VERSION=${{ matrix.netbox_version }}
          cache-from: type=gha,scope=netbox-${{ matrix.netbox_version }}
          provenance: true
          sbom: true
      - name: Sign immutable image tag
        if: env.RELEASE_ENABLED == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Sign published image
        if: env.RELEASE_ENABLED == 'true'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          repository=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${REGISTRY}/${repository}:${IMAGE_TAG}@${DIGEST}"
      - name: Scan the published immutable image
        if: env.RELEASE_ENABLED == 'true'
        env:
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          repository=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          image="${REGISTRY}/${repository}:${IMAGE_TAG}"
          grype "$image" -o json --file published-grype.json
          trivy image --format json --output published-trivy.json --no-progress "$image"
          echo '{"matches":[]}' > empty-grype.json
          echo '{"Results":[]}' > empty-trivy.json
          mkdir -p released-image-report
          python scripts/security_report.py report \
            --before empty-grype.json empty-trivy.json \
            --after published-grype.json published-trivy.json \
            --image "$image" \
            --output "released-image-report/${IMAGE_TAG}.md" || true
      - name: Upload published-image vulnerability report
        if: env.RELEASE_ENABLED == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: released-image-report-${{ matrix.image_tag }}
          path: released-image-report/
          if-no-files-found: error
      - name: Create GitHub release for published image
        if: env.RELEASE_ENABLED == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          NETBOX_VERSION: ${{ matrix.netbox_version }}
        run: |
          repository=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          notes=$(mktemp)
          {
            echo "# NetBox ${NETBOX_VERSION} container revision ${IMAGE_TAG}"
            echo
            echo "Image: \`${REGISTRY}/${repository}:${IMAGE_TAG}\`"
            echo
            cat security-report.md
          } > "$notes"
          if gh release view "v${IMAGE_TAG}" >/dev/null 2>&1; then
            gh release edit "v${IMAGE_TAG}" --title "NetBox ${IMAGE_TAG}" --notes-file "$notes"
          else
            gh release create "v${IMAGE_TAG}" --title "NetBox ${IMAGE_TAG}" --notes-file "$notes" --target "$GITHUB_SHA"
          fi

  update-readme:
    if: >-
      needs.verify-and-release.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [matrix, verify-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: released-image-report-*
          path: released-image-reports
          merge-multiple: true
      - name: Update released-image CVE table
        run: >-
          python scripts/update_readme_images.py README.md versions.json released-image-reports
          "$GITHUB_REPOSITORY" --preserve-missing
      - name: Create or update README PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch-token: ${{ github.token }}
          branch: automation/update-image-cve-table
          delete-branch: true
          commit-message: "docs: update released image CVE table"
          title: "docs: update released image CVE table"
          body: |
            Updates the released-image table from scans of the immutable images that were just published.

            This is a documentation-only update and does not publish or revise any image.
          labels: security,automated,documentation
      - name: Enable automatic merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash && exit 0
            [ "$attempt" -eq 3 ] || sleep 10
          done
          exit 1
