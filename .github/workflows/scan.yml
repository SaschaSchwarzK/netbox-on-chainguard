name: Nightly CVE Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: |
          echo "versions=$(jq -c '{include: [.versions[] | {version: .version, tag: (.version + "-r" + (.revision | tostring))}]}' versions.json)" >> "$GITHUB_OUTPUT"

  scan:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve image
        run: |
          repository=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${REGISTRY}/${repository}:${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan with Grype and Trivy
        run: |
          grype "${{ steps.image.outputs.ref }}" -o json --file grype.json || true
          trivy image --format json --output trivy.json --no-progress "${{ steps.image.outputs.ref }}" || true
          python scripts/security_report.py check grype.json trivy.json
      - name: Create SARIF
        if: always()
        run: grype "${{ steps.image.outputs.ref }}" -o sarif --file grype.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: grype.sarif
          category: grype-${{ matrix.tag }}
